name: WakeTrace
options:
  bundleIdPrefix: com.wakatrace
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  WakeTrace:
    type: application
    platform: macOS
    sources:
      - path: WakeTrace
    info:
      path: WakeTrace/Resources/Info.plist
      properties:
        CFBundleDisplayName: WakeTrace
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableDescription: "Know what your Mac does while it sleeps."
        NSUserNotificationsUsageDescription: "WakeTrace sends a notification after waking if unusual sleep activity is detected."
        CFBundleIconFile: AppIcon
    entitlements:
      path: WakeTrace/WakeTrace.entitlements
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakatrace.WakeTrace
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
